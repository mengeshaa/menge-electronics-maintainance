<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Menge Electronics Maintenance</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="admin-style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <h2>Menge <span>Electronics</span></h2>
            </div>
            <ul class="nav-links">
                <li class="active"><a href="#"><i class="fas fa-th-large"></i> Dashboard</a></li>
                <li><a href="index.html" target="_blank"><i class="fas fa-globe"></i> View Website</a></li>
            </ul>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <h1>Admin Control Panel</h1>
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                <div>
    <strong>Mengesha Demis</strong><br>
    <small>📞 0932198941 | ✉️ mengeshademis56@gmail.com</small>
</div>
                </div>
            </header>

            <!-- Overview Cards -->
            <section class="stats-grid">
                <div class="card">
                    <i class="fas fa-tools icon-total"></i>
                    <div>
                        <h3 id="total-count">0</h3>
                        <p>Total Requests</p>
                    </div>
                </div>
                <div class="card">
                    <i class="fas fa-clock icon-pending"></i>
                    <div>
                        <h3 id="pending-count">0</h3>
                        <p>Pending Repairs</p>
                    </div>
                </div>
                <div class="card">
                    <i class="fas fa-check-circle icon-completed"></i>
                    <div>
                        <h3 id="completed-count">0</h3>
                        <p>Completed Repairs</p>
                    </div>
                </div>
            </section>

            <!-- Table Section -->
            <section class="table-container">
                <div class="table-header">
                    <h2>Maintenance Requests</h2>
                    <button class="btn-clear" onclick="clearAllData()"><i class="fas fa-trash"></i> Clear All</button>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Customer Name</th>
                            <th>Phone</th>
                            <th>Device / Issue</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="requests-table-body">
                        <!-- Data will be loaded dynamically -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <!-- JavaScript Link -->
    <script src="admin-script.js"></script>
</body>
</html>
